name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All tests (extractor + store packaging)
        run: npm test
      - name: 100% coverage gate on extractor.js
        run: npm run coverage
      - name: Store zips build
        run: npm run package
