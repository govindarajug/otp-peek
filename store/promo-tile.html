<!doctype html>
<!-- Chrome Web Store small promo tile source (440x280). Rendered by
     `npm run assets`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(160deg, #14b8a6 0%, #0f766e 100%);
        color: #fff;
        font: 18px/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img { width: 88px; height: 88px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.25)); }
      h2 { margin: 4px 0 0; font-size: 34px; }
      p { margin: 0; opacity: 0.92; }
    </style>
  </head>
  <body>
    <img src="../icons/icon.svg" alt="" />
    <h2>OTP Peek</h2>
    <p>Newest Gmail login code, one click to copy</p>
  </body>
</html>
